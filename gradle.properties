# JVM 参数：给 Kotlin/AGP 足够内存，并用 UTF-8 保证中文注释与资源不乱码。
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=8298 -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=8298 -Djavax.net.ssl.trustStoreType=WINDOWS-ROOT
# 使用 AndroidX。
android.useAndroidX=true
# 非传递性 R 类，加快构建。
android.nonTransitiveRClass=true
# Kotlin 官方代码风格。
kotlin.code.style=official
# 允许中文（非 ASCII）项目路径。
android.overridePathCheck=true
